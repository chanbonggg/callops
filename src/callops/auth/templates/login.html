<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CallOps 로그인</title>
  <link rel="stylesheet" href="/task-assets/tasks.css">
</head>
<body>
  <header class="app-header login-header">
    <div class="wordmark"><span><img src="/task-assets/wave.svg" width="21" height="21" alt=""></span>CallOps</div>
  </header>
  <main class="login-main">
    <form class="card login-card" method="post" aria-labelledby="login-title"{% if error %} aria-describedby="login-error"{% endif %}>
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="login-heading">
        <h1 id="login-title">로그인</h1>
        <p>소유자 계정으로 접속하세요.</p>
      </div>
      <div class="fields login-fields">
        <div class="login-field">
          <label for="login-username">사용자 이름</label>
          <input id="login-username" name="username" autocomplete="username" required>
        </div>
        <div class="login-field">
          <label for="login-password">비밀번호</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <div class="login-actions">
        {% if error == 'LOGIN_FAILED' %}
        <p id="login-error" class="notice login-message error" role="alert">사용자 이름 또는 비밀번호를 확인해 주세요.</p>
        {% elif error == 'LOGIN_THROTTLED' %}
        <p id="login-error" class="notice login-message" role="alert">로그인 시도가 너무 많습니다.<br>잠시 후 다시 시도해 주세요.</p>
        {% endif %}
        <button class="primary" type="submit">로그인</button>
      </div>
    </form>
  </main>
</body>
</html>
